server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Assets de Vite (nombres con hash de contenido) — caché 1 año, inmutable
    # El hash en el nombre garantiza que un cambio genera una URL nueva
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend SPA — index.html nunca se cachea
    # Esto asegura que el navegador siempre pida la versión más reciente,
    # que a su vez referencia los nuevos hashes de JS/CSS
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Resolver DNS de Docker — re-resuelve el hostname del backend dinámicamente
    # (evita que nginx cachee la IP al arrancar y falle tras recrear el contenedor)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy hacia el backend FastAPI
    # proxy_pass sin URI (solo host:puerto) preserva el path original /api/...
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy para docs de FastAPI (opcional)
    location /docs {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
