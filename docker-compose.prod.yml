version: "3.9"

# ══════════════════════════════════════════════════════════════
#  SONAR v2 — Docker Compose PRODUCCIÓN
#  Uso: docker compose -f docker-compose.prod.yml up -d --build
# ══════════════════════════════════════════════════════════════

services:

  # ── Base de datos PostgreSQL + pgvector ─────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: sonar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Limitar memoria de PostgreSQL en servidor de 1GB
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c wal_buffers=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M

  # ── Redis (broker Celery) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sonar_redis
    restart: unless-stopped
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 60M

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_backend
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    volumes:
      - storage_data:/app/storage
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M

  # ── Celery Worker ────────────────────────────────────────────
  worker:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_worker
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=1 --max-memory-per-child=200000
    deploy:
      resources:
        limits:
          memory: 350M

  # ── Celery Beat (scheduler) ──────────────────────────────────
  beat:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_beat
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=warning
    deploy:
      resources:
        limits:
          memory: 100M

  # ── Frontend (Nginx + React build) ──────────────────────────
  frontend:
    image: ghcr.io/yonatanlop/sonar-frontend:latest
    container_name: sonar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
