version: "3.9"

# ══════════════════════════════════════════════════════════════
#  SONAR v2 — Docker Compose PRODUCCIÓN
#  Uso: docker compose -f docker-compose.prod.yml up -d --build
# ══════════════════════════════════════════════════════════════

services:

  # ── Base de datos PostgreSQL + pgvector ─────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: sonar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Limitar memoria de PostgreSQL en servidor de 1GB
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c wal_buffers=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Expuesto solo en localhost para el túnel SSH del worker externo (Facebook)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M

  # ── Redis (broker Celery) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sonar_redis
    restart: unless-stopped
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    # Expuesto solo en localhost para el túnel SSH del worker externo (Facebook)
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 60M

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    image: ghcr.io/yonatanlop/sonar-backend:2.5
    container_name: sonar_backend
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    volumes:
      - storage_data:/app/storage
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      autoheal: "true"     # autoheal reinicia este contenedor si queda 'unhealthy'
    healthcheck:
      # curl no está en la imagen → usar python para pegarle a /health
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 288M

  # ── Celery Worker ────────────────────────────────────────────
  worker:
    image: ghcr.io/yonatanlop/sonar-backend:2.5
    container_name: sonar_worker
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=1 --max-memory-per-child=200000 --exclude-queues=facebook,tiktok
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Celery Beat (scheduler) ──────────────────────────────────
  beat:
    image: ghcr.io/yonatanlop/sonar-backend:2.5
    container_name: sonar_beat
    restart: unless-stopped
    env_file: .env
    environment:
      FACE_RECOGNITION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=warning
    deploy:
      resources:
        limits:
          memory: 100M

  # ── Frontend (Nginx + React build) ──────────────────────────
  frontend:
    image: ghcr.io/yonatanlop/sonar-frontend:2.5
    container_name: sonar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 48M

  # ── Autoheal ─────────────────────────────────────────────────
  # Vigila los contenedores con label `autoheal=true` y los reinicia si Docker
  # los marca 'unhealthy'. Cubre cuelgues que NO son OOM (el OOM ya se auto-cura
  # solo porque el servidor es PID 1 tras quitar --reload).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: sonar_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"       # revisa cada 15s
      AUTOHEAL_START_PERIOD: "60"   # espera 60s antes de vigilar tras arrancar
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 24M

volumes:
  postgres_data:
  storage_data:
