version: "3.9"

# ══════════════════════════════════════════════════════════════
#  SONAR v2 — Docker Compose PRODUCCIÓN
#  Uso: docker compose -f docker-compose.prod.yml up -d --build
# ══════════════════════════════════════════════════════════════

services:

  # ── Base de datos PostgreSQL + pgvector ─────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: sonar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # En producción NO exponer el puerto 5432 al exterior
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (broker Celery) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sonar_redis
    restart: unless-stopped
    # En producción NO exponer el puerto 6379 al exterior
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ──────────────────────────────────────────
  # Imagen pre-compilada en GitHub Actions → ghcr.io (sin compilar en Oracle)
  backend:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/app/storage
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ────────────────────────────────────────────
  worker:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ── Celery Beat (scheduler) ──────────────────────────────────
  beat:
    image: ghcr.io/yonatanlop/sonar-backend:latest
    container_name: sonar_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ── Frontend (Nginx + React build) ──────────────────────────
  frontend:
    image: ghcr.io/yonatanlop/sonar-frontend:latest
    container_name: sonar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
