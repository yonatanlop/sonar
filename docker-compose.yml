services:

  # ── Infraestructura ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: sonar_db
    env_file: .env.v2
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sonar_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sonar_redis
    ports:
      - "6379:6379"
    networks:
      - sonar_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonar_backend
    env_file: .env.v2
    volumes:
      - ./backend:/app
      - storage_data_v2:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sonar_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonar_worker
    env_file: .env.v2
    volumes:
      - ./backend:/app
      - storage_data_v2:/app/storage
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sonar_net

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonar_beat
    env_file: .env.v2
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sonar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sonar_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sonar_net

volumes:
  postgres_data:
  storage_data_v2:

networks:
  sonar_net:
    driver: bridge
