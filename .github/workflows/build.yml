name: Build & Push Docker Images

on:
  push:
    branches: [version2, version2.5]

env:
  REGISTRY: ghcr.io
  OWNER: yonatanlop

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "version2" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=2.5" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.OWNER }}/sonar-backend:${{ steps.tag.outputs.tag }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "version2" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=2.5" >> $GITHUB_OUTPUT
          fi

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=http://163.176.221.142
          tags: ghcr.io/${{ env.OWNER }}/sonar-frontend:${{ steps.tag.outputs.tag }}
