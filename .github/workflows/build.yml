name: Build & Push Docker Images

on:
  push:
    branches: [version2, version3]

env:
  REGISTRY: ghcr.io
  OWNER: yonatanlop

jobs:
  # ── V2: producción activa ────────────────────────────────────
  build-v2-backend:
    if: github.ref == 'refs/heads/version2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.OWNER }}/sonar-backend:latest

  build-v2-frontend:
    if: github.ref == 'refs/heads/version2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=http://163.176.221.142
          tags: ghcr.io/${{ env.OWNER }}/sonar-frontend:latest

  # ── V3: desarrollo hexagonal ─────────────────────────────────
  build-v3-backend:
    if: github.ref == 'refs/heads/version3'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./sonar-v3/backend
          file: ./sonar-v3/backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.OWNER }}/sonar-v3-backend:latest

  build-v3-frontend:
    if: github.ref == 'refs/heads/version3'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./sonar-v3/frontend
          file: ./sonar-v3/frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=http://163.176.221.142:8001
          tags: ghcr.io/${{ env.OWNER }}/sonar-v3-frontend:latest
